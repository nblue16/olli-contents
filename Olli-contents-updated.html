const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(DATA.iv) }, key, b64(DATA.ct));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
const form = document.getElementById('gate'), btn = document.getElementById('go'), err = document.getElementById('err');
form.addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  if (!window.crypto || !crypto.subtle) { err.textContent = 'Please open this page from its https:// link to unlock it.'; return; }
  btn.disabled = true; btn.textContent = 'Unlocking…'; err.textContent = '';
  try {
    const html = await unlock(pw);
    try { sessionStorage.setItem('olli-buddyos-pw', pw); } catch (e2) {}
    show(html);
  } catch (e2) {
    err.textContent = 'Incorrect password. Please try again.';
    btn.disabled = false; btn.textContent = 'Unlock';
  }
});
// Stay unlocked for the rest of this browser tab (e.g. after a reload).
(async () => {
  let pw = null;
  try { pw = sessionStorage.getItem('olli-buddyos-pw'); } catch (e) {}
  if (pw) { try { show(await unlock(pw)); } catch (e) {} }
})();
</script>
